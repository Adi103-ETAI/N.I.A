#
# docker-compose.yml for N.I.A — Neural Intelligence Assistant
#
# Ported from Hermes Agent's docker-compose.yml architecture.
#
# Usage:
#   NIA_UID=$(id -u) NIA_GID=$(id -g) docker compose up -d
#
# Set NIA_UID / NIA_GID to the host user that owns ~/.nia so files
# created inside the container stay readable/writable on the host.
# The entrypoint.sh remaps the internal `nia` user to these values
# via usermod/groupmod.
#
# Security notes:
#   - The container runs as root initially (for UID remap + volume chown),
#     then drops to the `nia` user for the main process.
#   - /opt/data is a named volume (or bind-mount ~/.nia:/opt/data).
#   - API keys should be passed via environment or .env file, NOT baked
#     into the image.

services:
  nia:
    build: .
    image: nia-agent
    container_name: nia
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      # Mount NIA home directory (SOUL.md, memory, sessions, credentials, etc.)
      - nia-home:/opt/data
      # Mount project directory for file operations (optional)
      # - ./workspace:/workspace
    environment:
      - NIA_UID=${NIA_UID:-10000}
      - NIA_GID=${NIA_GID:-10000}
      # API key — at least one is required. Set in .env or here.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Override the default model (optional)
      - NIAHARNESS_MODEL=${NIAHARNESS_MODEL:-}
      # Budget enforcement (optional)
      - NIAHARNESS_MAX_TURNS=${NIAHARNESS_MAX_TURNS:-90}
      - NIAHARNESS_MAX_BUDGET_USD=${NIAHARNESS_MAX_BUDGET_USD:-}
      # Telegram gateway (optional)
      - NIA_TELEGRAM_BOT_TOKEN=${NIA_TELEGRAM_BOT_TOKEN:-}
      # Auxiliary model for background tasks (optional — use a cheaper model)
      - NIA_AUX_MODEL=${NIA_AUX_MODEL:-}
      - NIA_AUX_API_KEY=${NIA_AUX_API_KEY:-}

volumes:
  nia-home:
