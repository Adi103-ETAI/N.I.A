# NIA Supervisor Agent Configuration
# v4.0.0 - Unified YAML format

name: NIA
version: "4.0.0"
debug_mode: false
log_level: INFO

# Routing configuration
routing_mode: hybrid
confidence_threshold: 0.7

# Gatekeeper settings
gatekeeper:
  enabled: true
  fallback_agent: chat

# LangGraph settings
graph:
  max_iterations: 10
  timeout_seconds: 30

# Memory settings
memory:
  enabled: true
  max_conversation_length: 50

# Routing keywords (migrated from routing.json)
routing:
  tara_keywords:
    categories:
      app_control:
        - open
        - launch
        - run
        - start
        - execute
        - close
        - kill
        - terminate
        - exit
        - quit
        - stop
      interaction:
        - click
        - type
        - press
        - select
      navigation:
        - search
        - browse
        - google
        - navigate
      verification:
        - check
        - verify
        - test
  iris_keywords:
    categories:
      perception:
        - look
        - see
        - watch
        - describe
      screen:
        - screen
        - screenshot
        - monitor
      phrase:
        - what is on
        - what's on
        - show me
  general_fallback: general
