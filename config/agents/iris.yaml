# IRIS Vision Agent Configuration
# v4.0.0 - Unified YAML format

name: IRIS
version: "4.0.0"
debug_mode: false
log_level: INFO

# Vision model settings
vision_model: meta/llama-3.2-90b-vision-instruct
confidence_threshold: 0.6

# Sentry mode configuration (migrated from sentry.json)
sentry:
  enabled: true
  scan_interval: 8
  triggers:
    security:
      - password
      - credential
      - unauthorized
      - breach
      - 2fa
      - verification code
      - otp
      - authentication
    comms:
      - new message
      - notification
      - incoming call
      - unread
      - missed call
  ignore_patterns:
    - sentry
    - routing to iris
    - "nia:"

# Vision triggers (migrated from triggers.json)
triggers:
  screen:
    - screen
    - screenshot
    - window
    - monitor
    - display
    - terminal
    - code
    - what is on
  camera:
    - camera
    - webcam
    - photo
    - picture
    - selfie
    - room
    - face
    - capture
    - see me
    - snapshot
  actions:
    - look at
    - what do you see
    - analyze this
    - vision
    - look
    - see
    - watch
    - view
    - read this
