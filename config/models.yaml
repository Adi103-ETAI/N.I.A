# LLM Model Configurations
# v4.0.0 - Unified YAML format

default_provider: nvidia

valid_providers:
  - nvidia
  - openai
  - groq
  - ollama

# Provider API configurations (API keys from environment)
providers:
  nvidia:
    api_key: ${NVIDIA_API_KEY}
    model: meta/llama-3.1-70b-instruct
    temperature: 0.7
    max_tokens: 2000
    
  openai:
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o
    temperature: 0.7
    max_tokens: 2000
    
  groq:
    api_key: ${GROQ_API_KEY}
    model: llama-3.1-70b-versatile
    temperature: 0.7
    max_tokens: 2000
    
  ollama:
    api_key: null
    model: llama3.1
    temperature: 0.7
    max_tokens: 2000
    base_url: http://localhost:11434

# Fallback chain when primary provider fails
fallback_chain:
  - nvidia
  - openai
  - ollama

# Model catalog (migrated from models.json)
models:
  # NVIDIA Models
  nvidia/llama-3.1-405b:
    provider: nvidia
    model_name: meta/llama-3.1-405b-instruct
    display_name: Llama 3.1 405B (NVIDIA)
    context_window: 128000
    supports_vision: false
    supports_function_calling: true
    is_local: false
    cost_tier: free
    speed_tier: slow
    
